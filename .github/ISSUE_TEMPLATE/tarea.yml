name: Tarea técnica
description: Plantilla para tareas técnicas colaborativas
title: "[Tarea] Breve descripción aquí"
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: "## 📝 Descripción\nExplicá brevemente qué se quiere lograr."
  - type: textarea
    id: tareas
    attributes:
      label: 📌 Tareas específicas
      description: Listá los pasos técnicos o visuales que hay que implementar.
      placeholder: "- [ ] Crear vista admin.html\n- [ ] Mostrar usuarios desde localStorage"
    validations:
      required: true
