<!DOCTYPE html>
<html lang="es_AR" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="keywords"
      content="Productos, marcas, home, decoracion, mercado libre, Rolling Code"
    />
    <meta
      name="description"
      content="página web que simula ser la oficial de mercado libre"
    />
    <meta name="author" content="Desarrollado por Pablo Basso" />
    <title>Challenge 10 Pablo Basso</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link
      rel="shortcut icon"
      href="../media/logo-mercado-liebre.svg"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header>
      <!-- Navbar -->
      <nav class="navbar navbar-expand-lg bg-custom shadow py-3 sticky-top">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">
            <img
              class="nav-logo"
              src="../media/logo-mercado-liebre.svg"
              alt=""
            />
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item" id="navCerrarSesion">
                <button
                  class="btn btn-outline-danger btn-sm ms-2"
                  id="btnCerrarSesion"
                >
                  Cerrar sesión
                </button>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container py-5">
      <div class="container">
        <div class="row">
          <div class="col">
            <h1>Administración</h1>
          </div>
        </div>
        <div class="row">
          <div class="col-12 col-md-6 offset-md-3">
            <h3>Agregar nueva Gift Card</h3>
            <form id="formGift">
              <div class="row mt-3">
                <div class="col">
                  <label>Gift</label>
                  <input type="text" class="form-control" id="gift" required />
                </div>
                <div class="col">
                  <label>Tipo</label>
                  <select id="tipo" class="form-control">
                    <option value="Suscripción">Suscripción</option>
                    <option value="Compra">Compra</option>
                  </select>
                </div>
              </div>
              <div class="row mt-3">
                <div class="col">
                  <label>Tiempo</label>
                  <select id="tiempo" class="form-control">
                    <option value="1 mes">1 mes</option>
                    <option value="3 meses">3 meses</option>
                    <option value="5 meses">5 meses</option>
                  </select>
                </div>
                <div class="col">
                  <label>Precio</label>
                  <input
                    type="number"
                    class="form-control"
                    id="precio"
                    required
                  />
                </div>
              </div>
              <div class="row mt-3">
                <div class="col">
                  <input
                    type="text"
                    id="imagen"
                    class="form-control"
                    required
                    placeholder="URL de la imagen"
                  />
                </div>
              </div>
              <div class="mt-3 d-flex justify-content-end">
                <button class="btn btn-info">Guardar</button>
              </div>
            </form>
          </div>
        </div>
        <div class="row">
          <div class="col-12 col-md-8 offset-md-2">
            <h3>Tabla de contenido</h3>
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>Gift</th>
                  <th>tipo</th>
                  <th>Tiempo</th>
                  <th>Precio</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="cuerpo-tabla"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Modal -->
      <div
        class="modal fade"
        id="modalGift"
        tabindex="-1"
        aria-labelledby="modalGiftLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="modalGiftLabel">
                Modificar Gift
              </h1>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <form id="formModal">
                <div class="row mb-3">
                  <div class="col">
                    <label for="">Gift</label>
                    <input
                      type="text"
                      id="giftModal"
                      class="form-control"
                      required
                    />
                  </div>
                  <div class="col">
                    <label for="tipo">Tipo</label>
                    <select name="tipo" id="tipoModal" class="form-control">
                      <option value="Suscripción">Sucripción</option>
                      <option value="Compra">Compra</option>
                    </select>
                  </div>
                </div>
                <div class="row mb-3">
                  <div class="col">
                    <label for="tiempo">Tiempo</label>
                    <select name="tiempo" id="tiempoModal" class="form-control">
                      <option value="1 mes">1 mes</option>
                      <option value="3 meses">3 meses</option>
                      <option value="5 meses">5 meses</option>
                    </select>
                  </div>
                  <div class="col">
                    <label for="">Precio</label>
                    <input
                      type="number"
                      id="precioModal"
                      class="form-control"
                      required
                    />
                  </div>
                </div>
                <div class="row mt-3">
                  <div class="col">
                    <label for="">Imagen</label>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="URL de la imagen"
                      id="imagenModal"
                      required
                    />
                  </div>
                </div>
                <div class="mt-3 d-flex justify-content-end">
                  <button class="btn btn-info">Actualizar</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <section class="footer-copyright text-center text-muted py-3">
        <div class="container">
          <small
            >Copyright © 1999–2025 <strong>MercadoLibre S.R.L.</strong> Todos
            los derechos reservados.</small
          >
        </div>
      </section>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="../js/modules/admin.js"></script>
  </body>
</html>
